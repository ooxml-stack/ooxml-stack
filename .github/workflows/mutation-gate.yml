name: Mutation Gate

on:
  workflow_call:
    inputs:
      format:
        description: ooxml format to gate (pptx | docx | xlsx)
        required: true
        type: string

permissions:
  contents: read

jobs:
  mutation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      - name: Install workflow Python
        run: uv python install "${UV_PYTHON:-3.12}"

      - name: Configure private dependency access
        uses: ooxml-stack/ooxml-stack/.github/actions/setup-private-deps@566659e9b81e2c46196e0e8c38923896c2f363f5
        with:
          stack-token: ${{ secrets.OOXML_STACK_TOKEN }}
          core-deploy-key: ${{ secrets.OOXML_CORE_DEPLOY_KEY }}
          spec-deploy-key: ${{ secrets.OOXML_SPEC_DEPLOY_KEY }}
          test-framework-deploy-key: ${{ secrets.OOXML_TEST_FRAMEWORK_DEPLOY_KEY }}

      - name: Install dependencies
        run: uv sync --frozen --extra mutation-gate

      - name: Clone ooxml-stack
        run: git clone --depth 1 https://github.com/ooxml-stack/ooxml-stack.git ../ooxml-stack

      - name: Run mutation gate
        run: uv run python ../ooxml-stack/scripts/ci_mutation_gate.py "${{ inputs.format }}"

      - name: Mutation gate summary
        if: always()
        run: |
          {
            echo "## Mutation Gate"
            echo ""
            echo "| Format | Status |"
            echo "|--------|--------|"
            echo "| ${{ inputs.format }} | \`${{ job.status }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
