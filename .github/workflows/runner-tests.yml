name: Runner Tests

# The shared runner's regressions are the only automatic check that the
# snapshot, adapter-loading, identity, stage-protocol and report-verification
# contracts still hold. They must not be able to go missing: this workflow runs
# on every pull request and every push, so a change to the runner, its tests,
# the shared fixtures, the pinned test requirements, the Makefile entry point or
# this file itself always runs them.

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  runner-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install the pinned test interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install the pinned runner test dependencies
        run: make ecosystem-inventory-deps
      - name: Run the shared runner regressions
        run: make runner-test