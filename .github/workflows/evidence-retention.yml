name: Evidence Retention

on:
  pull_request:
  push:

jobs:
  evidence-retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release evidence retention
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/check_evidence_retention.py --base-ref "${{ github.event.pull_request.base.sha }}"
          else
            python scripts/check_evidence_retention.py --base-ref "${{ github.event.before }}"
          fi
