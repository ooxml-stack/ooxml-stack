name: Evidence Retention

on:
  pull_request:
  push:

jobs:
  evidence-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Check release evidence retention
        shell: bash
        run: python scripts/check_evidence_retention.py
