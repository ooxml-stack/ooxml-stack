<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P69 Zero Preserve Dashboard</title>
<style>
:root { color-scheme: light; --ink:#172026; --muted:#5d6972; --line:#d7dde2; --pass:#16734c; --warn:#9b5d00; --bg:#f7f8fa; --panel:#ffffff; }
* { box-sizing: border-box; }
body { margin:0; font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
header { padding:24px 28px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
h1 { margin:0 0 8px; font-size:24px; letter-spacing:0; }
main { padding:20px 28px 36px; display:grid; gap:18px; }
section { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:16px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; }
.metric { border:1px solid var(--line); border-radius:6px; padding:12px; min-height:76px; }
.metric b { display:block; font-size:22px; }
.metric span { color:var(--muted); }
table { width:100%; border-collapse:collapse; }
th,td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
th { color:var(--muted); font-weight:600; }
.pass { color:var(--pass); font-weight:700; }
pre { white-space:pre-wrap; overflow:auto; background:#f2f4f6; border:1px solid var(--line); border-radius:6px; padding:10px; max-height:220px; }
</style>
</head>
<body>
<header><h1>P69 Zero Preserve Dashboard</h1><div class="pass">PASS under measured P61-P68 denominator</div></header>
<main>
<section><h2>Counts</h2><div id="metrics" class="grid"></div></section>
<section><h2>Promotion Sources</h2><div id="sources"></div></section>
<section><h2>Operation Coverage</h2><div id="ops"></div></section>
<section><h2>Sample Before/After XML</h2><div id="samples"></div></section>
<section><h2>Claim Boundary</h2><p id="boundary"></p></section>
</main>

<script>
const d = JSON.parse(document.getElementById('dashboard-data').textContent);
const metrics = ['baseline_preserve_only_status_count','public_api_preserve_only_status_count','public_api_active_editable_status_count','aggregate_package_level_covered_count','promoted_from_preserve_only_count','dashboard_blocker_rows_count'];

function table(rows, cols) { return '<table><thead><tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>`<td>${r[c] ?? ''}</td>`).join('')+'</tr>').join('')+'</tbody></table>'; }
