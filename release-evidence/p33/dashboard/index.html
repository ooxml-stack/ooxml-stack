<script>const S=JSON.parse(document.getElementById('summary-data').textContent),M=JSON.parse(document.getElementById('matrix-data').textContent),C=JSON.parse(document.getElementById('cases-data').textContent);const $=id=>document.getElementById(id);const pct=(a,b)=>b?Math.round(a*100/b):0;function badge(v){return `<span class="badge ${v?'pass':'fail'}">${v?'PASS':'FAIL'}</span>`}function init(){ $('status').innerHTML=badge(S.gate_pass);$('claim').textContent=S.claim_boundary;$('boundary').textContent=S.claim_boundary;$('nonclaims').innerHTML=S.non_claims.map(x=>`<li>${x}</li>`).join('');renderKpis();renderMatrix();renderOps();initFilters();renderCases()}function renderKpis(){const rows=[['Locate/classify',S.locate_classify_pass,S.selected_cases],['Families',S.represented_drawing_families,M.families.length],['Edit/control outcomes',S.operation_outcome_pass,S.selected_cases],['Semantic edits',S.semantic_edit_hit,S.active_edit_cases],['Preserve controls',S.preserve_control_pass,S.preserve_control_cases],['Library open-save',S.library_open_save_pass,S.selected_cases],['Package invariants',S.package_invariant_pass,S.selected_cases],['Desktop Word open',S.desktop_word_open_pass,S.selected_cases],['Blockers',S.word_repair_dialogs+S.word_security_dialogs+S.office_crashes+S.macro_dialogs_timeouts+S.relationship_loss+S.missing_parts+S.unintended_binary_media_mutation+S.unsupported_silent_noop+S.public_claim_beyond_measured_cells,0]];$('kpis').innerHTML=rows.map(([n,a,b])=>`<div class="kpi ${b? (a===b?'pass':'fail'):(a===0?'pass':'fail')}"><span>${n}</span><b>${b?`${a}/${b}`:a}</b></div>`).join('')}function renderMatrix(){const cols=M.operations.length+1;let html=`<div class="grid" style="grid-template-columns:150px repeat(${M.operations.length},minmax(92px,1fr))"><div class="cell head">family</div>`;html+=M.operations.map(o=>`<div class="cell head">${o}</div>`).join('');for(const f of M.families){html+=`<div class="cell head">${f}</div>`;for(const o of M.operations){const c=M.cells.find(x=>x.family===f&&x.operation===o);const n=c.denominator?`${c.pass_count}/${c.denominator}`:'';html+=`<div class="cell ${c.status}" title="${c.evidence_source}"><b>${c.status}</b><br>${n}</div>`}}$('matrix').innerHTML=html+'</div>'}function renderOps(){const max=Math.max(...Object.values(S.operation_counts));$('ops').innerHTML=Object.entries(S.operation_counts).map(([op,n])=>`<div class="bar"><code>${op}</code><div class="track"><div class="fill" style="width:${pct(n,max)}%"></div></div><b>${n}/${n}</b></div>`).join('')}function initFilters(){const ops=['',...M.operations],fams=['',...M.families],stats=['','supported-active','preserve-only','unsupported','out-of-scope','pass','fail'];$('op').innerHTML=ops.map(x=>`<option>${x}</option>`).join('');$('family').innerHTML=fams.map(x=>`<option>${x}</option>`).join('');$('caseStatus').innerHTML=stats.map(x=>`<option>${x}</option>`).join('');['q','op','family','caseStatus'].forEach(id=>$(id).addEventListener('input',renderCases));$('reset').onclick=()=>{['q','op','family','caseStatus'].forEach(id=>$(id).value='');renderCases()}}function renderCases(){const q=$('q').value.toLowerCase(),op=$('op').value,f=$('family').value,st=$('caseStatus').value;const rows=C.cases.filter(c=>(!q||JSON.stringify(c).toLowerCase().includes(q))&&(!op||c.operation===op)&&(!f||c.family===f)&&(!st||c.capability_status===st||c.case_status===st));$('casecount').textContent=`${rows.length}/${C.cases.length}`;$('cases').innerHTML=rows.map(c=>`<tr><td><code>${c.case_id}</code></td><td>${c.family}</td><td>${c.operation}</td><td>${c.story_part}</td><td><span class="badge ${c.case_status==='pass'?'pass':'fail'}">${c.case_status}</span> <span class="badge ${c.capability_status}">${c.capability_status}</span></td><td>${c.semantic_pass?'semantic pass':'semantic fail'}<br><code>${c.semantic_diff.changed_element||''}</code></td><td>${c.package_invariant_pass?'package pass':'package fail'} / ${c.desktop_word_status}</td><td><code>${c.output_file}</code></td></tr>`).join('')}init();</script>
